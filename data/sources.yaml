# Bibliography for the Timeline Bible.
#
# Each key is cited from data/anchors.yaml and data/nt/*.yaml as "key" or
# "key locator" (e.g. "josephus-ant 17.167"). The build fails on an unknown key.
#
# status:
#   verified   - someone has checked the work and the locators used against a copy.
#   unverified - cited from general knowledge of the work. The work and its
#                position are well known, but locators other than ancient
#                book/section numbers still need checking against a copy.
# Change a source to "verified" only after checking it.

# --- Ancient sources ------------------------------------------------------

josephus-ant:
  short: Josephus, Antiquities
  full: "Flavius Josephus, *Jewish Antiquities* (c. AD 93–94). Greek text and translation: Loeb Classical Library; public-domain translation by William Whiston (1737)."
  kind: ancient
  status: unverified

josephus-war:
  short: Josephus, Jewish War
  full: "Flavius Josephus, *The Jewish War* (c. AD 75–79). Loeb Classical Library; Whiston translation."
  kind: ancient
  status: unverified

tacitus-ann:
