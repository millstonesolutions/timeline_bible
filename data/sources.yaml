# Bibliography for the Timeline Bible.
#
# Each key is cited from data/anchors.yaml and data/nt/*.yaml as "key" or
# "key locator" (e.g. "josephus-ant 17.167"). The build fails on an unknown key.
#
# status:
#   verified   - someone has checked the work and the locators used against a copy.
#   unverified - cited from general knowledge of the work. The work and its
#                position are well known, but locators other than ancient
#                book/section numbers still need checking against a copy.
# Change a source to "verified" only after checking it.

# --- Ancient sources ------------------------------------------------------

josephus-ant:
  short: Josephus, Antiquities
  full: "Flavius Josephus, *Jewish Antiquities* (c. AD 93–94). Greek text and translation: Loeb Classical Library; public-domain translation by William Whiston (1737)."
  kind: ancient
  status: unverified

josephus-war:
  short: Josephus, Jewish War
  full: "Flavius Josephus, *The Jewish War* (c. AD 75–79). Loeb Classical Library; Whiston translation."
  kind: ancient
  status: unverified

tacitus-ann:
  short: Tacitus, Annals
  full: "Cornelius Tacitus, *Annals* (c. AD 116–120). Loeb Classical Library."
  kind: ancient
  status: unverified

suetonius-claud:
  short: Suetonius, Claudius
  full: "Suetonius, *Lives of the Caesars*, 'Claudius' (c. AD 121). Loeb Classical Library."
  kind: ancient
  status: unverified

orosius:
  short: Orosius, History
  full: "Paulus Orosius, *Seven Books of History against the Pagans* (c. AD 417)."
  kind: ancient
  status: unverified

dio:
  short: Cassius Dio, Roman History
  full: "Cassius Dio, *Roman History* (early 3rd century AD). Loeb Classical Library."
  kind: ancient
  status: unverified

gallio-inscription:
  short: Delphi (Gallio) inscription
  full: "Letter of Claudius to Delphi naming L. Junius Gallio as proconsul of Achaia, dated by Claudius's 26th imperial acclamation (AD 52). *Fouilles de Delphes* III.4 no. 286; SIG³ 801D."
  kind: inscription
  status: unverified

irenaeus:
  short: Irenaeus, Against Heresies
  full: "Irenaeus of Lyon, *Against Heresies* (c. AD 180)."
  kind: ancient
  status: unverified

eusebius-he:
  short: Eusebius, Church History
  full: "Eusebius of Caesarea, *Ecclesiastical History* (early 4th century AD)."
  kind: ancient
  status: unverified

clement-1:
  short: 1 Clement
  full: "*1 Clement* (letter of the church of Rome to Corinth, usually dated c. AD 95–96)."
  kind: ancient
  status: unverified

