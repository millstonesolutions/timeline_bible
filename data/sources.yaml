  full: "Cornelius Tacitus, *Annals* (c. AD 116–120). Loeb Classical Library."
  kind: ancient
  status: unverified

suetonius-claud:
  short: Suetonius, Claudius
  full: "Suetonius, *Lives of the Caesars*, 'Claudius' (c. AD 121). Loeb Classical Library."
