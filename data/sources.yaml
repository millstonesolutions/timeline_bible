# --- Ancient texts and inscriptions ---------------------------------------------

anet:
  short: ANET
  full: "James B. Pritchard (ed.), *Ancient Near Eastern Texts Relating to the Old Testament*, 3rd ed. (Princeton: Princeton University Press, 1969). Standard translations of the inscriptions below."
  kind: modern
  status: unverified

merneptah-stele:
  short: Merneptah Stele
  full: "Victory stele of Pharaoh Merneptah, year 5 (c. 1208 BC), Cairo Museum; the earliest mention of 'Israel' outside the Bible, as a people in Canaan. Translation in ANET 376–378."
  kind: inscription
  status: unverified

shoshenq-relief:
  short: Shoshenq I relief
  full: "Shoshenq I's (biblical Shishak's) list of conquered towns in Canaan on the Bubastite Portal at Karnak, c. 925 BC."
  kind: inscription
  status: unverified

mesha-stele:
  short: Mesha Stele
  full: "Mesha Stele (Moabite Stone), c. 840 BC, Louvre; King Mesha of Moab on Omri's dynasty and his revolt (cf. 2 Kings 3). Translation in ANET 320–321."
  kind: inscription
  status: unverified

tel-dan:
  short: Tel Dan inscription
  full: "Aramaic victory stele from Tel Dan, 9th century BC, naming a king of 'the house of David'. A. Biran and J. Naveh, *Israel Exploration Journal* 43 (1993): 81–98 and 45 (1995): 1–18."
  kind: inscription
  status: unverified

kurkh-monolith:
  short: Kurkh Monolith
  full: "Kurkh Monolith of Shalmaneser III, British Museum: the battle of Qarqar (853 BC), naming 'Ahab the Israelite' among the coalition. Translation in ANET 278–279."
  kind: inscription
  status: unverified

black-obelisk:
  short: Black Obelisk
  full: "Black Obelisk of Shalmaneser III, British Museum: tribute of 'Jehu son of Omri' in Shalmaneser's 18th year (841 BC). Translation in ANET 280–281."
  kind: inscription
  status: unverified

eponym-canon:
  short: Assyrian eponym list
  full: "The Assyrian eponym (limmu) lists, which name each year after an official and record a solar eclipse in the eponymy of Bur-Saggile, astronomically fixed to 15 June 763 BC. This fixes Assyrian, and through synchronisms Israelite, chronology."
  kind: inscription
  status: unverified

sennacherib-annals:
  short: Sennacherib's annals
  full: "Annals of Sennacherib (Taylor, Oriental Institute and Jerusalem prisms) on the campaign of 701 BC: Hezekiah shut up in Jerusalem 'like a bird in a cage'. Translation in ANET 287–288."
  kind: inscription
  status: unverified

babylonian-chronicle:
  short: Babylonian Chronicle
  full: "Babylonian Chronicles, especially ABC 5 (the early years of Nebuchadnezzar II): Carchemish (605 BC) and the capture of Jerusalem on 2 Adar of year 7 (15/16 March 597 BC). Edition: Grayson 1975."
  kind: inscription
  status: unverified

cyrus-cylinder:
  short: Cyrus Cylinder
  full: "Cyrus Cylinder (539 BC or soon after), British Museum: Cyrus's capture of Babylon and his return of deported peoples and their gods. Translation in ANET 315–316."
  kind: inscription
  status: unverified

elephantine-papyri:
  short: Elephantine papyri
  full: "Aramaic papyri from the Jewish garrison at Elephantine, Egypt (5th century BC); the petition to Bagohi of 407 BC names the high priest Johanan and the sons of Sanballat. Translation in ANET 491–492."
  kind: ancient
  status: unverified

dead-sea-scrolls:
  short: Dead Sea Scrolls
  full: "Biblical manuscripts from Qumran (c. 250 BC – AD 68), e.g. the Great Isaiah Scroll (1QIsaᵃ, c. 125 BC) and copies of Daniel from the late 2nd century BC; they set the latest possible date for each book's text."
  kind: ancient
  status: unverified

maccabees-1:
  short: 1 Maccabees
  full: "*1 Maccabees* (late 2nd century BC): the desecration of the temple by Antiochus IV (15 Kislev 167 BC, 1:54) and its rededication (25 Kislev 164 BC, 4:52)."
  kind: ancient
  status: unverified

sirach:
  short: Sirach
  full: "*Wisdom of Ben Sira* (Sirach), c. 180 BC, translated by his grandson c. 132 BC; chs. 44–50 survey Israel's heroes and books, including 'the Twelve Prophets' (49:10)."
  kind: ancient
  status: unverified

josephus-apion:
  short: Josephus, Against Apion
  full: "Flavius Josephus, *Against Apion* (c. AD 95); 1.37–43 on the 22 books of the Jewish scriptures, written from Moses to Artaxerxes."
  kind: ancient
  status: unverified

bava-batra:
  short: Talmud, Bava Batra
  full: "Babylonian Talmud, *Bava Batra* 14b–15a (compiled c. AD 500, using earlier traditions): the traditional authors and order of the books of the Hebrew Bible."
  kind: ancient
  status: unverified

seder-olam:
  short: Seder Olam Rabbah
  full: "*Seder Olam Rabbah* (rabbinic chronology attributed to Yose ben Halafta, 2nd century AD), the basis of the traditional Jewish era from creation."
  kind: ancient
  status: unverified

ussher:
  short: Ussher 1650
  full: "James Ussher, *Annales Veteris Testamenti* (London, 1650); English *The Annals of the World* (1658). Creation in 4004 BC, the flood in 2348 BC."
  kind: modern
  status: unverified

