book: Luke
code: LUK
order: 42
slug: 42-luke

written:
  date: "c. AD 80–90 (some say c. 60–62)"
  range: [60, 100]
  summary: >-
    Luke-Acts is usually dated c. AD 80–90; a conservative minority date it c. 60–62,
    when Acts ends; a few date it to the early 2nd century.
  views:
    - date: "AD 80–90"
      held_by: Most critical scholars (Brown c. 85 ± 5–10; Ehrman)
      basis: >-
        Luke uses Mark; 19:43–44 and 21:20–24 (Jerusalem "surrounded by armies",
        "trampled by the Gentiles") are read as reflecting the siege of AD 70.
      sources: [brown-intro, ehrman-nt]
    - date: "c. AD 60–62"
      held_by: Some conservative scholars (Hemer; Robinson; Carson & Moo discuss it favourably)
      basis: >-
        Acts, the second volume, ends with Paul still awaiting trial in Rome
        (c. AD 62) and says nothing of his death, Nero's persecution or the temple's
        fall, so Luke (the first volume) must be earlier still.
      sources: [hemer, robinson, carson-moo]
    - date: "AD 110–120"
      held_by: Pervo and a few others (for Luke-Acts in its final form)
      basis: Acts' use of Josephus and the Pauline letters, and its kinship with second-century apologetic.
      sources: [pervo]

chapters:
  1:
    date: "c. 7–5 BC"
    range: [-8, -4]
    anchors: [birth]
    note: >-
      "In the days of Herod, the king of Judea" (1:5). John the Baptist is announced
      about six months before Jesus (1:26, 36) and born first (1:57).
  2:
    date: "c. 6–4 BC (birth); c. AD 7–9 (age twelve)"
    range: [-6, 9]
    anchors: [birth, childhood]
    note: >-
      The census "when Quirinius was governor of Syria" (2:2) is the chief
      chronological problem in the birth narratives (Josephus dates Quirinius's
      census of Judea to AD 6). 2:41–52 is set when Jesus was twelve.
    sources: ["josephus-ant 18.1–2, 18.26", brown-birth Appendix VII]
  3:
    date: "AD 27–29"
    a: "late AD 27 / early 28"
    b: "AD 28/29"
    range: [27, 29]
    anchors: [ministry-start, models]
    note: >-
      The most precise date in the Gospels: "in the fifteenth year of the reign of
      Tiberius Caesar" (3:1), with Pilate, Herod Antipas, Philip, Lysanias, Annas and
      Caiaphas. Jesus is "about thirty years old" (3:23). The genealogy (3:23–38) has
      no date of its own.
  4:
    date: "AD 28 or 29–30"
    a: "AD 28"
    b: "AD 29–30"
    range: [28, 30]
    anchors: [models]
    note: Temptation, then the Galilean ministry opens with the Nazareth sermon (4:16–30).
  5: &early_galilee
    date: "AD 28 or 30–31"
    a: "AD 28"
    b: "AD 30–31"
    range: [28, 31]
    anchors: [models]
  6:
    date: "AD 28 or 31"
    a: "AD 28"
    b: "AD 31"
    range: [28, 31]
    anchors: [models]
    note: >-
      Grain fields (6:1) indicate spring; choosing the twelve and the Sermon on the
      Plain follow.
  7:
    date: "AD 28 or 31"
    a: "AD 28"
    b: "AD 31"
    range: [28, 31]
    anchors: [models]
    note: John's disciples come from prison (7:18–23).
  8:
    date: "AD 28–29 or 31"
    a: "AD 28–29"
    b: "AD 31"
    range: [28, 31]
    anchors: [models]
  9:
    date: "spring–autumn AD 29 or 32"
    a: "spring–autumn AD 29"
    b: "spring–autumn AD 32"
    range: [29, 32]
    anchors: [john-baptist-death, models]
    note: >-
      The twelve sent out, Herod's perplexity about John (9:7–9), the feeding of the
      5,000, Peter's confession, the Transfiguration, and at 9:51 the turn toward
      Jerusalem, which opens Luke's long travel narrative.
  10: &travel
    date: "autumn AD 29 – spring 30, or autumn 32 – spring 33"
    a: "autumn AD 29 – spring 30"
    b: "autumn AD 32 – spring 33"
    range: [29, 33]
    anchors: [models]
    note: >-
      Luke's travel narrative (9:51–19:27) is arranged mostly by theme; its stories
      cannot be ordered precisely. John's Tabernacles and Dedication visits
      (John 7–10) fall in this period.
  11: *travel
  12: *travel
  13:
    date: "autumn AD 29 – spring 30, or autumn 32 – spring 33"
    a: "autumn AD 29 – spring 30"
    b: "autumn AD 32 – spring 33"
    range: [29, 33]
    anchors: [models]
    note: >-
      The Galileans "whose blood Pilate had mixed with their sacrifices" (13:1) and
      the tower in Siloam (13:4) are incidents otherwise unknown; they fit Pilate's
      term but don't fix the year. Herod Antipas is still ruling (13:31).
  14: *travel
  15: *travel
  16: *travel
  17: *travel
  18:
    date: "March AD 30 or 33"
    a: "early AD 30"
    b: "early AD 33"
    range: [30, 33]
    anchors: [models]
    note: Ends with the approach to Jericho (18:35), just before the last Passover.
  19:
    date: "late March – Sunday 2 April AD 30, or 29 March AD 33"
    a: "to 2 April AD 30"
    b: "to 29 March AD 33"
    range: [30, 33]
    anchors: [passion-week, temple-70]
    note: >-
      Zacchaeus at Jericho, the parable of the minas, the entry into Jerusalem
      (19:28–40), the lament over the city (19:41–44, an important text for dating
      Luke) and the temple cleansing.
  20:
    date: "Tuesday, 4 April AD 30 or 31 March AD 33"
    a: "4 April AD 30"
    b: "31 March AD 33"
    range: [30, 33]
    anchors: [passion-week]
    note: Luke only says "on one of those days" (20:1); the weekday follows the usual harmony with Mark.
  21:
    date: "Tuesday, 4 April AD 30 or 31 March AD 33"
    a: "4 April AD 30"
    b: "31 March AD 33"
    range: [30, 33]
    anchors: [passion-week, temple-70]
    note: >-
      The temple discourse. "When you see Jerusalem surrounded by armies" (21:20) is
      the main text in the debate over whether Luke was written after AD 70.
  22:
    date: "Wednesday – Friday dawn, 5–7 April AD 30 or 1–3 April AD 33"
    a: "5–7 April AD 30"
    b: "1–3 April AD 33"
    range: [30, 33]
    anchors: [passion-week]
    note: Judas's agreement, the supper (a Passover meal in Luke, 22:7–15), the arrest, Peter's denial and the morning council (22:66).
  23:
    date: "Friday, 7 April AD 30 or 3 April AD 33"
    a: "7 April AD 30"
    b: "3 April AD 33"
    range: [30, 33]
    anchors: [crucifixion]
    note: Only Luke tells of the hearing before Herod Antipas (23:6–12), who was in Jerusalem for the feast.
  24:
    date: "Sunday, 9 April AD 30 or 5 April AD 33 (ascension about 40 days later)"
    a: "9 April – c. 18 May AD 30"
    b: "5 April – c. 14 May AD 33"
    range: [30, 33]
    anchors: [resurrection-ascension]
    note: >-
      Luke 24 reads as if everything happens on Easter Sunday; Luke's own Acts 1:3
      puts the ascension forty days later.
