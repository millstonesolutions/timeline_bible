      held_by: Bauckham (possibly the 50s); many conservative scholars
      basis: Palestinian Jewish-Christian apocalyptic exegesis; the author lived in the first Christian generation.
      sources: [bauckham-jude, carson-moo]
    - date: "c. AD 90–120"
      held_by: Brown (90s); many critical scholars
      basis: "\"Remember the words spoken before by the apostles\" (v. 17) looks back on the apostolic age; \"the faith once for all delivered\" (v. 3)."
      sources: [brown-intro]

