written:
  date: "c. AD 65–73"
  range: [40, 75]
  summary: >-
    Most scholars date Mark just before or just after AD 70, usually AD 65–73; a
    small minority argue for the 40s.
  views:
    - date: "AD 68–73"
      held_by: Brown; many critical scholars
      basis: >-
        Mark 13 seems to reflect the Jewish War (66–70); "the abomination of
        desolation" (13:14) and the temple's predicted fall (13:2) are read as close
        to, or just after, the event.
      sources: [brown-intro, ehrman-nt]
    - date: "AD 64–68 (Rome, under Nero)"
      held_by: Many scholars, following early tradition; Carson & Moo regard the late 50s or 60s as likely
      basis: >-
        Papias (in Eusebius, *H.E.* 3.39.15) and Irenaeus (*Against Heresies* 3.1.1)
        connect Mark with Peter's preaching in Rome, around or after Peter's death;
        the emphasis on suffering fits Nero's persecution.
      sources: [carson-moo, eusebius-he 3.39.15, irenaeus 3.1.1]
    - date: "late 30s–early 40s"
      held_by: Crossley (minority)
      basis: Mark assumes that Jesus kept the Torah, which Crossley argues predates the disputes of the 40s–50s.
      sources: [crossley]

