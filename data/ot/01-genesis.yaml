book: Genesis
code: GEN
order: 1
slug: 01-genesis
kind: narrative

written:
  date: "Mosaic (c. 1446–1406 or 1260–1220 BC) or compiled c. 950–400 BC"
  range: [-1446, -400]
  anchors: [pentateuch]
  summary: >-
    Genesis has no author's name or date. Tradition makes it the first of the five
    books of Moses. Most critical scholars see it woven from older sources: a
    non-priestly narrative (the documentary hypothesis's J, and some E) and a
    priestly layer (P) that supplies the "generations" headings, Genesis 1, the
    genealogies and the dates. The book was complete by the Persian period. Details
    such as "before any king reigned over the children of Israel" (36:31), "the
    Canaanite was then in the land" (12:6) and "Ur of the Chaldeans" (11:31) show at
    least some writing after Moses on any view.
  views:
    - date: "Moses, c. 1446–1406 BC (or c. 1260–1220 BC), with later editing"
      held_by: Jewish and Christian tradition; conservative scholars (Kitchen; Dillard & Longman accept Mosaic authorship in substance with post-Mosaic additions)
      basis: >-
        Ascribed to Moses by Josephus and the Talmud. The patriarchal customs, names
        and slave prices fit the early 2nd millennium BC better than the 1st
        (Kitchen). Verses such as 36:31 are taken as later updating by scribes.
      sources: [josephus-apion 1.37–43, bava-batra 14b–15a, kitchen, dillard-longman]
    - date: "Sources written c. 950–550 BC, combined c. 550–400 BC"
      held_by: Wellhausen and the classic documentary hypothesis; most critical scholars in revised forms (Collins)
      basis: >-
        Doublets (two creation accounts, 1:1–2:4a and 2:4b–25; two versions of the
        wife-sister story, chs. 12, 20 and 26), different names for God, and the
        priestly style of the genealogies and dates point to several hands. The
        classic model dates J to c. 950–850 BC and P to the exile or after.
      sources: [wellhausen, collins-intro]
    - date: "Mostly exilic or Persian period, c. 550–400 BC"
      held_by: Van Seters; Thompson; many recent European scholars
      basis: >-
        The patriarchal stories fit the 1st millennium BC and were composed as an
        origin story for Israel in exile; Van Seters dates his Yahwist to the exile.
      sources: [van-seters, thompson-patriarchs]

chapters:
  1:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      Creation in six days and God's rest on the seventh (1:1–2:3). Ussher's
      reckoning from the Hebrew genealogies put it in 4004 BC; the Septuagint's
      numbers give about 5500 BC. Critical scholars assign 1:1–2:4a to the priestly
      writer (P).
  2:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      The seventh day (2:1–3), then a second account of the creation of the man and
      woman in Eden (2:4b–25), usually assigned to the non-priestly source (J). The
      rivers Tigris and Euphrates (2:14) set the story in Mesopotamia.
  3:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: The serpent, the disobedience and the expulsion from Eden. No date can be given.
  4:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      Cain and Abel. Cain's line founds a city and invents music and metalwork in
      bronze and iron (4:17–22), skills that archaeologically belong to very
      different ages, so the chapter cannot be fixed to one.
  5:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      Ten generations from Adam to Noah. On the Hebrew figures they span 1,656 years
      from creation to the flood; the Septuagint and Samaritan Pentateuch give
      different totals. The long lifespans resemble the Sumerian King List's
      reigns before the flood.
  6:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      The "sons of God" and the daughters of men (6:1–4), God's decision to send the
      flood, and the ark. Noah is 500 years old at 5:32 and 600 when the flood comes
      (7:6).
  7:
    date: "Undated (Ussher: 2348 BC)"
    range: null
    anchors: [primeval]
    note: >-
      The flood begins in Noah's 600th year, on the 17th day of the second month
      (7:11), year 1656 from creation on the Hebrew figures. Ussher made this 2348 BC.
      The Mesopotamian flood stories in *Atrahasis* and Gilgamesh tablet XI are
      close parallels.
    sources: [lambert-millard]
  8:
    date: "Undated (Ussher: 2348–2347 BC)"
    range: null
    anchors: [primeval]
    note: >-
      The ark rests on the mountains of Ararat on the 17th of the seventh month
      (8:4); the earth is dry on the 27th of the second month of Noah's 601st year
      (8:14), about a year after it began. Sending out birds also appears in
      Gilgamesh XI.
    sources: [lambert-millard]
  9:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      The covenant with Noah and the rainbow; the curse of Canaan. Noah lives 350
      years after the flood and dies at 950 (9:28–29).
  10:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      The table of nations. Many of the peoples named belong to the Iron Age world
      of the 1st millennium BC, e.g. Javan (Ionian Greeks), Madai (Medes) and
      Gomer (Cimmerians), which critical scholars take as the writer's own horizon.
  11:
    date: "Undated (primeval history)"
    range: null
    anchors: [primeval]
    note: >-
      The tower of Babel (11:1–9), recalling Babylon's ziggurats, and the line from
      Shem to Terah (11:10–32). The Hebrew figures put 292 years from the flood to
      Abram's birth (Ussher 1996 BC; 2166 BC counting back from an exodus in 1446
      BC). "Ur of the Chaldeans" (11:28, 31) uses a name for southern Babylonia not
      attested before the 1st millennium BC.
    sources: [ussher]
  12:
    date: "c. 2091 or 1905 BC"
    a: "2091 BC"
    b: "c. 1905 BC"
    range: [-2091, -1905]
    anchors: [patriarchs]
    note: >-
      Abram leaves Haran aged 75 (12:4). The early date counts back from an exodus
      in 1446 BC with 430 years in Egypt (Exod 12:40) and the ages in Genesis; the
      late date applies the same figures to an exodus c. 1260 BC. If the 430 years
      include the time in Canaan (Septuagint), both come about 215 years later.
      Kitchen sets the patriarchs in the Middle Bronze Age; Thompson and Van Seters
      regard them as undatable.
  13:
    date: "c. 2090 or 1904 BC"
    a: "c. 2090 BC"
    b: "c. 1904 BC"
    range: [-2090, -1904]
    anchors: [patriarchs]
    note: >-
      Abram and Lot separate after the return from Egypt; Abram settles at Hebron.
      Undated, but before the ten years of 16:3 are out.
  14:
    date: "c. 2085 or 1899 BC"
    a: "c. 2085 BC"
    b: "c. 1899 BC"
    range: [-2091, -1895]
    anchors: [patriarchs]
    note: >-
      Four eastern kings raid the Jordan valley and Abram rescues Lot; Melchizedek
      blesses him. The kings (Amraphel of Shinar, Arioch, Chedorlaomer of Elam,
      Tidal) have not been identified with known rulers; the old equation of
      Amraphel with Hammurabi is abandoned. The chapter falls in Abram's first ten
      years in Canaan.
  15:
    date: "c. 2082 or 1896 BC"
    a: "c. 2082 BC"
    b: "c. 1896 BC"
    range: [-2085, -1895]
    anchors: [patriarchs]
