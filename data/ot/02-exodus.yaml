      The golden calf, at the end of the first forty days, about the 4th–5th month.
      Critical scholars often read it in light of Jeroboam I's calves at Bethel and
      Dan (1 Kgs 12:28, "behold your gods ... who brought you up out of the land of
      Egypt"), c. 930 BC.
