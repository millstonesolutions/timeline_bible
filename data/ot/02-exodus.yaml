  12:
    date: "spring (Abib 14–15) c. 1446 or 1260 BC"
    a: "Abib (March–April) 1446 BC"
    b: "Abib (March–April) c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: >-
      The month of the exodus becomes the first month (12:2); the lamb is killed on
      the 14th (12:6) and Israel leaves the next day (Num 33:3). The stay in Egypt
      was 430 years (12:40), to the day (12:41); the Septuagint and Samaritan text
      add "and in the land of Canaan".
  13:
    date: "spring c. 1446 or 1260 BC"
    a: "spring 1446 BC"
    b: "spring c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: >-
      "This day you go out, in the month Abib" (13:4). God leads them away from the
      coastal "way of the land of the Philistines" (13:17); the pillar of cloud and
      fire. Joseph's bones are carried out (13:19).
  14:
    date: "spring c. 1446 or 1260 BC"
    a: "spring 1446 BC"
    b: "spring c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: >-
      The crossing of the sea (Hebrew *yam suph*, "Sea of Reeds"), a few days after
      leaving Rameses. Its location, one of the lakes on the Isthmus of Suez or the
      Gulf of Suez, is debated (Hoffmeier).
    sources: [hoffmeier]
  15:
    date: "spring c. 1446 or 1260 BC"
    a: "spring 1446 BC"
    b: "spring c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus, wilderness]
    note: >-
      The Song of the Sea (15:1–18) and Miriam's song; then three days to Marah and
      on to Elim (15:22–27). Many scholars regard the song as some of the oldest
      poetry in the Bible.
    sources: [cross]
  16:
    date: "c. May 1446 or c. 1260 BC"
    a: "15th day of the 2nd month, 1446 BC"
    b: "15th day of the 2nd month, c. 1260 BC"
    range: [-1446, -1260]
    anchors: [wilderness]
    note: >-
      Israel reaches the wilderness of Sin "on the fifteenth day of the second month
      after their departing" (16:1), a month after the exodus; quail and manna.
  17:
    date: "c. 1446 or 1260 BC"
    a: "late spring 1446 BC"
    b: "late spring c. 1260 BC"
    range: [-1446, -1260]
    anchors: [wilderness]
    note: >-
      Water from the rock at Rephidim and the battle with Amalek; Moses is told to
      write it in a book (17:14). Between the second month (16:1) and the third
      (19:1).
  18:
    date: "c. 1446 or 1260 BC"
    a: "1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1259]
    anchors: [wilderness]
    note: >-
      Jethro's visit and the appointment of judges, "at the mountain of God" (18:5).
      Deuteronomy 1:9–18 sets the appointment at the departure from Horeb, and Num
      10:29 has Hobab there then, so the episode may belong a year later, placed
      here by topic.
  19:
    date: "3rd month (c. June) 1446 or c. 1260 BC"
    a: "3rd month, 1446 BC"
    b: "3rd month, c. 1260 BC"
    range: [-1446, -1260]
    anchors: [wilderness]
    note: >-
      "In the third month after the children of Israel had gone out of the land of
      Egypt, on that same day they came into the wilderness of Sinai" (19:1). Later
      Jewish tradition links the giving of the law with Pentecost (Shavuot). The
      mountain's location (Jebel Musa or elsewhere) is disputed.
  20:
    date: "c. June 1446 or c. 1260 BC"
    a: "1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1260]
    anchors: [wilderness]
    note: The Ten Commandments, on the third day after the people's preparation (19:11, 16).
  21: &covenant_code
    date: "1446 or c. 1260 BC"
    a: "1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1260]
    anchors: [wilderness]
    note: >-
      The Covenant Code (20:22–23:33), given at Sinai. Its case laws (e.g. the goring
      ox, 21:28–36) closely resemble the Laws of Hammurabi (c. 1750 BC) and other
      Mesopotamian codes. Critical scholars date the collection to the early
      monarchy or the time of the judges.
    sources: [anet]
