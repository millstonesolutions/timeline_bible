book: Exodus
code: EXO
order: 2
slug: 02-exodus
kind: narrative

written:
  date: "Mosaic (c. 1446–1406 or 1260–1220 BC) or compiled c. 950–400 BC"
  range: [-1446, -400]
  anchors: [pentateuch]
  summary: >-
    Exodus says that Moses wrote down certain laws and events (17:14; 24:4; 34:27),
    and tradition credits him with the whole book. Critical scholars see the same
    sources as in Genesis: an older non-priestly narrative and law code (the
    Covenant Code, 20:22–23:33, often dated to the early monarchy or before), and
    the priestly tabernacle chapters (25–31, 35–40), usually dated to the exile or
    after.
  views:
    - date: "Moses, c. 1446–1406 BC (or c. 1260–1220 BC)"
      held_by: Jewish and Christian tradition; conservative scholars (Kitchen; Dillard & Longman)
      basis: >-
        The book's own notes that Moses wrote (17:14; 24:4; 34:27); Egyptian
        background in the names (Moses, Phinehas), the brick-making and the
        geography of the eastern Delta (Hoffmeier); the covenant form of chs.
        20–24 resembles Late Bronze Age treaties (Kitchen).
      sources: [josephus-apion 1.37–43, bava-batra 14b–15a, kitchen, hoffmeier, dillard-longman]
    - date: "Sources c. 950–550 BC; priestly chapters exilic or later; complete c. 400 BC"
      held_by: Wellhausen; most critical scholars (Collins)
      basis: >-
        Two interwoven accounts of Moses' call (chs. 3 and 6) and of the plagues;
        the tabernacle, as described in chs. 25–31 and 35–40, is read as a
        projection of the Jerusalem temple and its priesthood. Milgrom and others
        date much priestly material before the exile.
      sources: [wellhausen, collins-intro, milgrom-lev]

chapters:
  1:
    date: "c. 1805–1526 or 1620–1340 BC"
    a: "c. 1805–1526 BC"
    b: "c. 1620–1340 BC"
    range: [-1805, -1340]
    anchors: [sojourn, exodus]
    note: >-
      From Joseph's death to the oppression under a king "who didn't know Joseph"
      (1:8). The Israelites build the store cities Pithom and Raamses (1:11); on the
      late date this is Pi-Ramesses, built by Ramesses II, while early-date
      supporters take the name as a later scribe's updating.
  2:
    date: "c. 1526–1486 or 1340–1300 BC"
    a: "1526 BC (birth) to c. 1486 BC (flight to Midian)"
    b: "c. 1340 to 1300 BC"
    range: [-1526, -1300]
    anchors: [sojourn, exodus]
    note: >-
      Moses is 80 at the exodus (7:7), so born c. 1526 BC on the early date. Acts
      7:23 makes him 40 when he kills the Egyptian and flees. "The king of Egypt
      died" (2:23) after "many days" in Midian.
