    a: "c. 1447/1446 BC"
    b: "c. 1261/1260 BC"
    range: [-1447, -1260]
    anchors: [exodus]
    note: The burning bush at Horeb; God's name revealed (3:14). Moses is about 80 (7:7).
  4:
    date: "c. 1446 or 1260 BC"
    a: "c. 1447/1446 BC"
    b: "c. 1261/1260 BC"
    range: [-1447, -1260]
    anchors: [exodus]
    note: Moses' signs and return to Egypt; Aaron meets him at the mountain of God.
  5:
