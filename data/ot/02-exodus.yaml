    a: "c. 1446 BC"
    b: "c. 1260 BC"
    range: [-1447, -1260]
    anchors: [exodus]
    note: >-
      Moses and Aaron before Pharaoh; bricks without straw. Pharaoh is unnamed. On
      the early date he is usually taken as Amenhotep II; on the late, Ramesses II.
  6:
    date: "c. 1446 or 1260 BC"
    a: "c. 1446 BC"
    b: "c. 1260 BC"
    range: [-1447, -1260]
    anchors: [exodus]
    note: >-
      God's name and promise renewed; the genealogy of Levi to Aaron and Moses
      (6:14–27), which gives Levi, Kohath and Amram long lifespans but only four
      generations for the stay in Egypt. Critical scholars read 6:2–8 as the
      priestly version of the call in ch. 3.
  7:
    date: "c. 1446 or 1260 BC"
    a: "c. 1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: >-
      Moses is 80 and Aaron 83 (7:7). The staff becomes a serpent; the first plague,
      the Nile turned to blood. The plagues are undated within the months before the
      Passover.
  8:
    date: "c. 1446 or 1260 BC"
    a: "c. 1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: Frogs, lice and flies; Goshen is spared (8:22).
  9:
    date: "c. 1446 or 1260 BC"
    a: "early 1446 BC"
    b: "c. 1260 BC"
    range: [-1446, -1260]
    anchors: [exodus]
    note: >-
      Livestock plague, boils and hail. The hail strikes the flax and barley, which
      were in the ear and in bloom, but not the wheat (9:31–32), which points to
      about February–March.
