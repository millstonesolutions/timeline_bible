book: 2 Samuel
code: 2SA
order: 10
slug: 10-2samuel
kind: narrative

written:
  date: "Nathan and Gad (tradition); c. 620–550 BC from older sources (critical)"
  range: [-1000, -540]
  summary: >-
    The second half of the one book of Samuel (see 1 Samuel). Its core, the court
    history of David (chs. 9–20, continued in 1 Kgs 1–2), is often dated close to the
    events, in Solomon's reign; the book as a whole belongs to the Deuteronomistic
    History.
  views:
    - date: "c. 970–930 BC"
      held_by: Jewish tradition (*Bava Batra* 15a); some conservative scholars
      basis: >-
        Gad and Nathan finished Samuel's book (cf. 1 Chr 29:29). The court history's
        intimate detail suggests an eyewitness or near-contemporary writer.
      sources: ["bava-batra 14b–15a"]
    - date: "Court history under Solomon; prophetic edition c. 700 BC"
      held_by: McCarter; many scholars (following Rost's "succession narrative")
      basis: >-
        Chs. 9–20 and 1 Kgs 1–2 read as one story of who would succeed David, often
        dated to Solomon's reign. Chs. 21–24 are an appendix of separate pieces
        (a famine, lists of warriors, two poems, the census).
      sources: [mccarter-sam, collins-intro]
    - date: "c. 620–550 BC (Deuteronomistic History)"
      held_by: Most critical scholars (Noth; Cross)
      basis: >-
        Nathan's oracle (ch. 7) is a key Deuteronomistic text, the promise of a
        lasting dynasty that the history of Kings then tests.
      sources: [noth-dtr, cross]

chapters:
  1:
    date: "c. 1010 BC"
    range: [-1011, -1009]
    anchors: [david, saul]
    note: >-
      Three days after David returns to Ziklag (1:2) an Amalekite brings news of
      Saul's death. David's lament for Saul and Jonathan is quoted from the book of
      Jashar (1:18).
  2:
    date: "c. 1010–1008 BC"
    range: [-1011, -1003]
    anchors: [david]
    note: >-
      David anointed king of Judah at Hebron (2:4), where he reigned 7½ years
      (2:11). Ish-bosheth reigns two years over Israel (2:10); the battle at the pool
      of Gibeon.
  3:
    date: "c. 1010–1004 BC"
    range: [-1011, -1003]
    anchors: [david]
    note: >-
      "There was long war between the house of Saul and the house of David" (3:1).
      David's sons born at Hebron (3:2–5); Abner changes sides and is killed by Joab.
  4:
    date: "c. 1004 BC"
    range: [-1006, -1003]
    anchors: [david]
    note: >-
      Ish-bosheth murdered. Mephibosheth was five when Saul died (4:4).
  5:
    date: "c. 1003 BC"
    range: [-1004, -995]
    anchors: [david]
    note: >-
      David king over all Israel at 30 (5:3–5), takes Jerusalem from the Jebusites
      and defeats the Philistines in the valley of Rephaim. Hiram's embassy (5:11)
      may be later: Hiram was still reigning under Solomon.
  6:
    date: "c. 1000 BC"
    range: [-1003, -990]
    anchors: [david]
    note: >-
      The ark brought up from Kiriath Jearim to Jerusalem (cf. 1 Sam 7:2); Uzzah's
      death; Michal despises David. 1 Chr 13–16 puts this before the Philistine wars.
  7:
    date: "c. 995–985 BC"
    range: [-1000, -975]
    anchors: [david, dtr-history]
    note: >-
      Nathan's oracle of a lasting dynasty, "when the king lived in his house and the
      LORD had given him rest" (7:1). Placed after the wars of ch. 8 by most, though
      told before them.
  8:
    date: "c. 1000–990 BC"
    range: [-1003, -980]
    anchors: [david]
    note: >-
      A summary of David's wars against the Philistines, Moab, Hadadezer of Zobah,
      Aram, Edom and Amalek, and his officials (8:15–18). Topical, not in sequence.
  9:
    date: "c. 995 BC"
    range: [-1000, -985]
    anchors: [david]
    note: >-
      David shows kindness to Mephibosheth, Jonathan's son, who now has a young son
      of his own (9:12). Start of the court history.
  10:
    date: "c. 993–990 BC"
    range: [-998, -985]
    anchors: [david]
    note: The Ammonite war. Hanun shames David's envoys and hires Arameans from Beth-rehob and Zobah.
  11:
    date: "c. 991–990 BC (spring)"
    range: [-998, -985]
    anchors: [david]
    note: >-
      "At the return of the year, at the time when kings go out" (11:1), spring. David
      and Bathsheba during the siege of Rabbah; Uriah's death.
  12:
    date: "c. 990 BC"
    range: [-998, -985]
    anchors: [david, solomon]
    note: >-
      Nathan's parable; the child dies; Solomon is born (12:24). Rabbah falls. A
      birth c. 990 makes Solomon about 20 at his accession in 970 BC.
  13:
    date: "c. 987–983 BC"
    range: [-992, -980]
    anchors: [david]
    note: >-
      Amnon rapes Tamar; "after two full years" (13:23) Absalom has him killed at
      sheep-shearing, then flees to Geshur for three years (13:38).
  14:
    date: "c. 983–981 BC"
    range: [-988, -978]
    anchors: [david]
    note: >-
      Joab and the wise woman of Tekoa bring Absalom home; two years pass before he
      sees the king (14:28).
  15:
    date: "c. 979 BC"
    range: [-985, -972]
    anchors: [david]
    note: >-
      Absalom's revolt. "At the end of forty years" (15:7) is usually read "four
      years" with the Septuagint (Lucianic), Syriac and Josephus. David flees
      across the Kidron (cf. Ps 3 heading).
    sources: [mccarter-sam]
  16:
    date: "c. 979 BC"
    range: [-985, -972]
    anchors: [david]
    note: Ziba's gift, Shimei's curses, and Absalom's entry into Jerusalem on Ahithophel's advice.
  17:
    date: "c. 979 BC"
    range: [-985, -972]
    anchors: [david]
    note: >-
      Hushai defeats Ahithophel's counsel; David crosses the Jordan to Mahanaim.
      The events of chs. 15–17 take only a few days.
  18:
    date: "c. 979 BC"
    range: [-985, -972]
    anchors: [david]
    note: Battle in the forest of Ephraim; Joab kills Absalom; "O my son Absalom" (18:33).
  19:
    date: "c. 979 BC"
    range: [-985, -972]
    anchors: [david]
    note: David returns to Jerusalem, pardons Shimei, and Israel and Judah quarrel over the king.
  20:
    date: "c. 979–978 BC"
    range: [-985, -972]
    anchors: [david]
    note: Sheba's revolt; Joab kills Amasa and besieges Abel Beth Maacah. List of officials (20:23–26).
  21:
    date: "Undated within David's reign (c. 1000–975 BC)"
    range: [-1003, -975]
    anchors: [david]
    note: >-
      Appendix. The three-year famine and the Gibeonites' revenge on Saul's sons
      "in the beginning of barley harvest" (21:9). Mephibosheth is spared (21:7), so
      many place it before ch. 9. Then Philistine wars and giants (21:15–22).
  22:
    date: "c. 1000–975 BC"
    range: [-1003, -970]
    anchors: [david, psalter]
    note: >-
      David's song "in the day that the LORD delivered him ... from the hand of
      Saul" (22:1), the same poem as Psalm 18. Undated within his reign; its archaic
      features lead many to date the poem itself early.
  23:
    date: "c. 971 BC (last words); the warriors from his whole reign"
    range: [-1010, -970]
    anchors: [david]
    note: >-
      "These are the last words of David" (23:1), then the lists of David's mighty
      men (23:8–39), whose deeds belong to the fugitive years and the wars.
  24:
    date: "c. 975 BC"
    range: [-985, -971]
    anchors: [david, solomon]
    note: >-
      The census takes 9 months and 20 days (24:8); plague; David buys Araunah's
      threshing floor, the future temple site (cf. 1 Chr 22:1). Usually placed late
      in the reign, while Joab is still commander.
