written:
  date: "Mosaic (c. 1406 or 1220 BC) or compiled c. 950–400 BC"
  range: [-1446, -400]
  anchors: [pentateuch]
  summary: >-
    Numbers covers the forty years from Sinai to the plains of Moab. Moses is said
    to have written down the itinerary (33:2), and tradition credits him with the
    book. Critical scholars see a priestly frame (the censuses, the camp, the laws
    of chs. 1–10, 15, 18–19, 26–36) around older non-priestly stories (the spies,
    Balaam), with the priestly parts among the latest in the Pentateuch.
  views:
    - date: "Moses, by c. 1406 BC (or c. 1220 BC)"
      held_by: Jewish and Christian tradition; conservative scholars (Kitchen; Dillard & Longman)
      basis: >-
        The book's claim that Moses recorded the stages of the journey (33:2); the
        wilderness camp setting; the itinerary has been compared with Egyptian
        route lists of the Late Bronze Age (Kitchen).
      sources: [josephus-apion 1.37–43, bava-batra 14b–15a, kitchen, dillard-longman]
    - date: "Older stories c. 900–600 BC; priestly frame exilic or later; complete c. 400 BC"
      held_by: Wellhausen; most critical scholars (Collins)
      basis: >-
        The huge census figures (603,550 men of fighting age, 1:46) imply two
        million people, which most historians regard as impossible for the
        period and read as schematic; the priestly laws presuppose the second
        temple's priesthood. The Balaam poems are often dated early.
      sources: [wellhausen, collins-intro]

