    anchors: [wilderness]
    note: >-
      The census begins "on the first day of the second month, in the second year
      after they had come out of the land of Egypt" (1:1), a month after the
      tabernacle was raised (Exod 40:17). The total of 603,550 men (1:46) is much
      debated; some read *eleph* as "clan" or "troop" rather than "thousand".
