    anchors: [david, psalter]
  18:
    date: "c. 1000–970 BC by the heading (late in David's reign), or later in the monarchy"
    range: [-1000, -587]
    sort: -985   # heading date
    anchors: [david, psalter]
    note: >-
      Heading: "in the day that the LORD delivered him from the hand of all his enemies, and
      from the hand of Saul". The same song appears in 2 Samuel 22, near the end of David's
      story. A royal thanksgiving: "to David and to his offspring, forever more" (18:50).
  19:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
  20:
    date: "Monarchy (c. 1010–587 BC)"
    range: [-1010, -587]
    anchors: [david, psalter]
    note: >-
      Heading "by David". A prayer for the king before battle (20:6, 9), so a royal psalm of the
      monarchy whoever wrote it.
  21:
    date: "Monarchy (c. 1010–587 BC)"
    range: [-1010, -587]
    anchors: [david, psalter]
    note: >-
      Heading "by David". Thanksgiving for the king's victory and crown (21:1–3).
  22:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      The lament Jesus quotes on the cross (22:1; Mark 15:34). Its date can't be fixed beyond
      the heading.
  23:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
  24:
