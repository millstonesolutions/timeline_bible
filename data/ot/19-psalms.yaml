    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      "Lift up your heads, you gates" (24:7–10) is often linked with a procession of the ark
      into Jerusalem, as in David's bringing of the ark (2 Sam 6, c. 1000 BC).
  25:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      An alphabetic acrostic.
  26:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
