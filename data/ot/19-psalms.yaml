book: Psalms
code: PSA
order: 19
slug: 19-psalms
kind: writing

written:
  date: "c. 1000–300 BC (collected by the 2nd century BC)"
  range: [-1000, -200]
  summary: >-
    The Psalter is an anthology written over many centuries and arranged in five books
    (1–41, 42–72, 73–89, 90–106, 107–150), each closed by a doxology. Its headings name
    David (73 psalms), Asaph (12), the sons of Korah (11), Solomon (2), Moses, Heman and
    Ethan (1 each), and some give an occasion in David's life. Contents range from royal
    psalms of the monarchy to laments over the destroyed temple (74, 79, 137) and songs of
    the return (126). The Dead Sea Scrolls show the first books fixed by the 2nd century BC
    and the order of the last two still fluid in the 1st.
  views:
    - date: "c. 1000 BC onward; the headings are reliable"
      held_by: Jewish and Christian tradition; many conservative scholars
      basis: >-
        The headings are old (the Septuagint translators had them in the 2nd century BC,
        though some of their terms were already obscure) and are taken as authorship
        notes. David was a musician and organizer of the temple singers (1 Sam 16:18;
        1 Chr 15–16, 25), and the New Testament cites psalms as David's (Mark 12:36;
        Acts 2:25–34; 4:25). The collection grew from David's time to the return from
        exile.
      sources: [dillard-longman, "bava-batra 14b–15a"]
    - date: "Monarchy to Persian period (c. 950–300 BC), collected c. 400–150 BC"
      held_by: Most critical scholars (Kraus; Collins)
      basis: >-
        Many psalms were written for worship in the Jerusalem temple under the kings
        (royal psalms such as 2, 45, 72, 110 need a reigning king); others are exilic or
        later. The headings were added by editors: le-David can mean "for" or "about
        David", and the historical notes link psalms to episodes in 1–2 Samuel as early
        interpretation (Childs). Books IV–V are generally the latest part of the
        collection.
      sources: [kraus-psalms, collins-intro, childs, dead-sea-scrolls]

default:
  date: "Undated (between c. 1000 and 300 BC)"
  range: [-1000, -300]
  anchors: [psalter]

chapters:
  1:
    note: >-
      No heading. A wisdom psalm on delighting in "the LORD's law" (1:2), placed as the
      introduction to the whole Psalter; many scholars think it was set here by the final
      editors after the exile.
  2:
    date: "Monarchy (c. 1010–587 BC)"
    range: [-1010, -587]
    anchors: [david, psalter]
    note: >-
      No heading, but a coronation psalm for a king in Zion (2:6–7), so it needs the monarchy.
      Acts 4:25 credits it to David; Acts 13:33 calls it "the second psalm".
  3:
    date: "c. 980 BC by the heading (Absalom's revolt), or later"
    range: [-1000, -400]
    sort: -980   # heading date
    anchors: [david, psalter]
    note: >-
      Heading: "when he fled from Absalom his son" (2 Sam 15–18). Absalom's revolt came late in
      David's reign. Like all the headings, this is a traditional attribution, probably added by
      editors; many scholars date the psalm itself later.
  4:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
  5:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      "I will bow toward your holy temple" (5:7) is read by some as a sign of a date after
      Solomon; but the tabernacle at Shiloh is also called a "temple" (1 Sam 1:9).
  6:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      The first of the seven traditional penitential psalms (6, 32, 38, 51, 102, 130, 143).
  7:
    date: "c. 1020–1010 BC by the heading (Saul's persecution?), or later"
    range: [-1020, -400]
    sort: -1015   # heading date
    anchors: [saul, david, psalter]
    note: >-
      Heading: "concerning the words of Cush, the Benjamite", a man otherwise unknown. Since
      Saul was a Benjamite, it is usually set in the years David fled from Saul.
  8:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
  9:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      Psalms 9 and 10 form one broken alphabetic acrostic and are a single psalm in the
      Septuagint.
  10:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      No heading of its own: it continues the acrostic of Psalm 9, so it takes Psalm 9's heading
      (the Septuagint joins them).
  11:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
