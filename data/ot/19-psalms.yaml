  14:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
    anchors: [david, psalter]
    note: >-
      Psalm 53 is nearly the same psalm with "God" (Elohim) for "the LORD", as in the Elohistic
      collection (Pss 42–83). "When the LORD restores the fortunes of his people" (14:7) is read
      by some as an exilic addition.
  15:
    date: "c. 1010–970 BC by the heading (David), or later"
    range: [-1010, -400]
    sort: -990   # heading date
